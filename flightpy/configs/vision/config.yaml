environment:
  level: "free" # three difficulty level [easy, medium, hard]
  env_folder: "environment_0" # configurations for dynamic and static obstacles
  world_box: [-20, 80, -10, 10, 0.0, 10] # Bounding box applied during training, exiting this box terminates the episode. [xmin, xmax, ymin, ymax, zmin, zmax]
  goal_vel: [3.0, 0.0, 0.0] # goal velicty for tracking vx, vy, vz
  max_detection_range: 10.0 # max obstacle detection range [m], obstacles outside this range will not be detected. The number of obstacles detected is fixed to 10, if less than 10 obstacles are within detectable range, the observation is padded with 10.0
  world_frame_name: "world"
  vehicle_frame_name: "vehicle"
  camera_frame_name: "camera"

rgb_camera:
  on: yes
  t_BC: [0.0, 0.0, 0.3] # translational vector of the camera with repect to the body frame
  r_BC: [0.0, 0.0, -90] # rotational angle (roll, pitch, yaw) of the camera in degree.
  channels: 3
  width: 320
  height: 240
  fov: 90.0
  enable_depth: yes
  enable_segmentation: no
  enable_opticalflow: no
  depth_uncertainty:
    ca0: 0.001
    ca1: 0.0007
    ca2: 0.005
    cl0: 0.0
    cl1: 0.0005
    cl2: 0.0013
  depth_noise_fused: yes

unity:
  scene_id: 2 # 0 warehouse, 1 industrial, 2 forest, 3 wasteland
  render: no

simulation:
  seed: 1
  sim_dt: 0.02
  max_t: 20.0
  num_envs: 100
  num_threads: 10

quadrotor_dynamics:
  mass: 0.752
  tbm_fr: [0.075, -0.10, 0.0] # [m]
  tbm_bl: [-0.075, 0.10, 0.0] # [m]
  tbm_br: [-0.075, -0.10, 0.0] # [m]
  tbm_fl: [0.075, 0.10, 0.0] # [m
  omega_max: [6.0, 6.0, 2.0]
  inertia: [0.0025, 0.0021, 0.0043]
  kappa: 0.022
  motor_omega_min: 150.0
  motor_omega_max: 2800.0
  motor_tau: 0.033
  thrust_map: [1.562522e-6, 0.0, 0.0] # max thrust = 8.50 N
  body_drag_1: [0.00, 0.00, 0.00]
  body_drag_3: [0.00, 0.00, 0.00]
  body_drag_h: 0.00

topics:
  # Flightmare topics
  depth: "/kingfisher/dodgeros_pilot/unity/depth"
  control_command: "/kingfisher/dodgeros_pilot/feedthrough_command"
  odometry: "/delta/odometry_sensor1/odometry"
  # Ardupilot topics
  # depth: "/d435/depth/image_rect_raw"
  # mavros_state: "/mavros/state"
  # mavros_odometry: "/mavros/odometry/in"

planning:
  runtime_mode: "flightmare" # "flightmare" or "mavros"
  go_to_goal_threshold: 3.0 # distance to goal for switching control
  # go_to_goal_threshold: 0.3 # distance to goal for switching control
  goal_coordinate:
    north: 6.0
    west: 0.0
    up: 1.0
  checking_time_ratio: 0.4
  depth_sampling_margin: 0.3
